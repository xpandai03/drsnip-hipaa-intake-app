# Fly.io deployment config — DrSnip intake form (Phase 1 scaffold).
#
# First-time setup:  fly apps create drsnip-intake-demo
# Set the database:  fly secrets set DATABASE_URL=postgres://...
# Deploy:            fly deploy
#
# Phase 3 — n8n bridge secrets. Set these BEFORE the first deploy that
# includes the bridge code, otherwise the bridge will short-circuit to
# 'failed: bridge disabled' (no harm — submissions still persist; the n8n
# call just doesn't fire).
#
#   fly secrets set \
#     N8N_WEBHOOK_REGISTRATION_URL=https://n8n-drsnip.fly.dev/webhook/custom-registration-6fe129ab \
#     N8N_WEBHOOK_CONSULTATION_URL=https://n8n-drsnip.fly.dev/webhook/custom-consultation-9f872020 \
#     N8N_WEBHOOK_SECRET=<the DRSNIP_WEBHOOK_SECRET value from the n8n side> \
#     N8N_BRIDGE_ENABLED=true \
#     -a drsnip-intake-demo
#
# Kill switch: `N8N_BRIDGE_ENABLED=false` disables every n8n call without a
# redeploy — submissions continue to land in Postgres exactly as before.

app = "drsnip-intake-demo"
primary_region = "lax"

# Train 2: give the shutdown drain room to finish. The bridge's own abort is
# 30 s and lib/lifecycle/inflight.ts caps the drain at 40 s, so Fly must not
# SIGKILL before then. Fly's default is 5 s, which cut every drain short.
# MUST stay above any table header — a bare key after one binds to that table.
kill_timeout = "45s"

[build]
  dockerfile = "Dockerfile"

  # Conversion tracking is compiled in at BUILD time (Vite inlines VITE_*), so
  # it must travel with every `fly deploy` — never as a Fly secret, which Vite
  # never sees. Pinned here because plain deploys without --build-arg compiled
  # it off from v75 (16 Sep 2026). The Dockerfile asserts the result.
  # Verify with `fly config show` (build.args), not by reading this file.
  [build.args]
    VITE_CONVERSION_TRACKING_ENABLED = "true"

# Runs once per deploy, in a temporary machine inside Fly's network (reaches
# Postgres over .flycast — no tunnel). Applies the SQL migrations + admin
# seed; all steps are idempotent.
[deploy]
  # migrate first (creates users.role via 0007), THEN the idempotent viewer seed
  # which prints a breach-check before its guarded insert. `&&` => seed only runs
  # if migrate succeeds; either failing fails the release (safe).
  # admin-ops.cjs (api-server/admin-ops.ts) is bundled into the image but is
  # intentionally NOT in this auto-chain — it resets/creates console users and
  # is run deliberately (stage ADMIN_RESET_*/PATIENTMAIL_VIEWER_* secrets, add
  # `&& node dist/admin-ops.cjs` here for one deploy, then revert + unset).
  release_command = "sh -c 'node dist/migrate.cjs && node dist/seed-viewer.cjs'"

[env]
  NODE_ENV = "production"
  PORT = "8080"

# Single web process serving both the SPA and the /api/* routes.
[http_service]
  internal_port = 8080
  force_https = true
  auto_stop_machines = true
  auto_start_machines = true
  # Train 2 (Class G). Was 0. api/submit.ts answers the caller and THEN runs the
  # n8n bridge; scaling the last machine to zero mid-bridge took the status
  # write-back with it and left the row's n8n_status NULL forever. One machine
  # now always stays up; the SECOND machine still autostops, so the cost delta
  # is one always-on shared-cpu-1x/512MB.
  min_machines_running = 1
  processes = ["app"]

  [[http_service.checks]]
    method = "get"
    path = "/healthz"
    interval = "15s"
    timeout = "2s"
    grace_period = "10s"

[[vm]]
  size = "shared-cpu-1x"
  memory = "512mb"
